name: Windows EXE test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Check app
        run: python -m py_compile main.py
      - name: Package application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LiveTranslator --collect-all faster_whisper --collect-all ctranslate2 --collect-all argostranslate main.py
      - name: Analyze packaged file sizes
        shell: pwsh
        run: |
          $root = "dist/LiveTranslator"
          $files = Get-ChildItem $root -File -Recurse
          $total = ($files | Measure-Object -Property Length -Sum).Sum
          "## Package size report" >> $env:GITHUB_STEP_SUMMARY
          ("Total unpacked size: {0:N1} MiB" -f ($total / 1MB)) >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Top 20 files | MiB |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---:|" >> $env:GITHUB_STEP_SUMMARY
          $files | Sort-Object Length -Descending | Select-Object -First 20 | ForEach-Object {
            ("| {0} | {1:N1} |" -f ($_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace("\\","/")), ($_.Length / 1MB)) >> $env:GITHUB_STEP_SUMMARY
          }
          $files | Sort-Object Length -Descending | Select-Object -First 80 | ForEach-Object {
            "{0:N2} MiB  {1}" -f ($_.Length / 1MB), $_.FullName
          }
      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-Windows-test
          path: dist/LiveTranslator/
          if-no-files-found: error
          retention-days: 7
