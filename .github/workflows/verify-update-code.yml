name: Verify update code (no EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-update-code.yml"
      - "updates/stable.json"

concurrency:
  group: verify-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile app_core.py updater.py streaming_pipeline.py launcher.py
          python -m py_compile updates/v0.6.27/app_core.py updates/v0.6.27/streaming_pipeline.py
          python -m unittest discover -s tests -p "test_patch_syntax.py" -v
      - name: Regression - direct first-click audio capture and preserved translation pipelines
        run: python -m unittest discover -s tests -v
